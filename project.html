  <script>

      } catch (e) {}

  <link rel="preload" href="assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>

        <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
          <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

        <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>

    <div class="mobile-menu" id="mobile-menu" hidden>
      <a href="./#about">About</a>
      <a href="./#skills">Skills</a>
      <a href="./#projects">Projects</a>
      <a href="./#journey">Journey</a>
      <a href="./#certifications">Certifications</a>
      <a href="./#contact">Contact</a>
      <a href="assets/resume.pdf" data-resume download>Download resume</a>

      <p id="footer-updated"></p>
      <a href="#main">Back to top</a>
    </div>

    <!-- Floating helpers (fixed to the corners of the screen) -->
    <a class="avail-pill" id="avail-pill" href="./#contact">
      <span class="pulse" aria-hidden="true"></span>
      <span data-bind="availability.pill">Availability</span>
    </a>
    <button class="to-top" id="to-top" type="button" aria-label="Back to top">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
    </button>
